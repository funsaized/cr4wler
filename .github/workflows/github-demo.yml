name: Record GitHub repository demo
on:
  workflow_dispatch:
  push:
    branches: [capture/github-demo]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node scripts/github-demo.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr4wler-github-demo
          path: artifacts/github-demo/
