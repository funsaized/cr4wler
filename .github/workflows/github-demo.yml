name: Record GitHub repository demo
on:
  workflow_dispatch:
  push:
    branches: [capture/browser-color]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb
      - run: xvfb-run -a -s "-screen 0 1440x1080x24" node scripts/github-demo.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr4wler-github-demo
          path: artifacts/github-demo/
